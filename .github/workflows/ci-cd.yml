name: CI/CD Production Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Voorkom dubbele deploys als je snel achter elkaar pusht
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Geüpdatet naar v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4 # Geüpdatet naar v4
        with:
          node-version: 22
          cache: 'npm' # Automatische cache van ~/.npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Source
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    # Alleen uitvoeren op de master branch, na een succesvolle build
    if: github.ref == 'refs/heads/master'
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # De moderne, token-loze manier